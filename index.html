<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<title>アルバム作業工程</title>
<meta name="description" content="卒部アルバム製作の作業工程表です。">
<meta property="og:type" content="website">
<meta property="og:title" content="アルバム作業工程">
<meta property="og:description" content="卒部アルバム製作の作業工程表です。">
<meta property="og:url" content="https://kudoryafuca19571108-hash.github.io/gantt-viewer/">
<style>
:root{color-scheme:light;--navy:#102b42;--ink:#193247;--muted:#657889;--line:#dde6ef;--bg:#f4f7fb;--row:53px;--left:192px;--day:14px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;color:var(--ink)}
header{background:var(--navy);color:white;padding:17px max(18px,calc((100vw - 1400px)/2));display:flex;justify-content:space-between;align-items:center;gap:12px}header h1{font-size:17px;margin:0;font-weight:750}header small{display:block;color:#b9d0df;margin-top:4px;font-size:11px}.readonly{border:1px solid #6386a2;border-radius:30px;padding:5px 9px;font-size:11px;white-space:nowrap}
main{max-width:1400px;margin:auto;padding:18px 16px 30px}.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:14px}.project{font-weight:800;font-size:17px;margin-right:auto;max-width:100%}.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.seg{display:flex;border:1px solid #cbd8e4;border-radius:9px;background:#fff;overflow:hidden}.seg button{padding:9px 13px;border:0;border-right:1px solid #e2eaf2;background:white;cursor:pointer;color:var(--ink);font-weight:650}.seg button:last-child{border-right:0}.seg button.active{background:#234b6e;color:#fff}.btn{padding:9px 11px;border:1px solid #cbd8e4;background:white;border-radius:9px;color:var(--ink);font-weight:600;cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid #63b6e6;outline-offset:2px}select{padding:9px;border:1px solid #cbd8e4;border-radius:9px;background:white;max-width:100%;color:var(--ink)}
.meta{font-size:12px;color:var(--muted);margin:0 0 13px;line-height:1.6}.legend{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:14px;color:var(--muted);font-size:12px}.legend span{display:flex;align-items:center;gap:6px}.swatch{display:inline-block;width:12px;height:12px;border-radius:3px;border:1px solid #b4c1cf}.chart{background:white;border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 3px 12px #23364a0b}.chart-scroll{overflow:auto;max-height:min(72vh,800px);overscroll-behavior:contain;position:relative}.chart-inner{min-width:100%;position:relative}.head-row,.gantt-row{display:flex;width:max-content;min-width:100%;position:relative}.head-row{height:70px;position:sticky;top:0;z-index:7;background:#fff}.head-left,.row-left{position:sticky;left:0;width:var(--left);min-width:var(--left);background:#fff;z-index:5;border-right:2px solid #cbd9e6;display:flex;align-items:center;padding:0 13px}.head-left{background:#e8f0f7;font-size:12px;font-weight:800;z-index:9}.row-left{font-size:12px;gap:9px;border-bottom:1px solid #edf1f6;line-height:1.4}.row-left .name{overflow-wrap:anywhere;font-weight:600}.row-left .check{color:#258b68;font-weight:900}.timeline-header{height:70px;position:relative;background:#f0f5fa;border-bottom:1px solid #cad9e7}.month-band{position:absolute;top:0;height:31px;border-right:1px solid #d3e0eb;border-bottom:1px solid #d8e3ec;white-space:nowrap;padding:7px 6px;font-weight:750;font-size:12px;overflow:hidden}.tick{position:absolute;top:31px;height:39px;border-right:1px solid #e5ecf3;text-align:center;padding-top:12px;font-size:10px;white-space:nowrap;color:#67798a;overflow:hidden}.tick.weekend{background:#eef2f6}.gantt-row{height:var(--row)}.timeline-row{position:relative;height:var(--row);border-bottom:1px solid #edf1f6;background:#fff}.grid-line{position:absolute;top:0;height:100%;border-right:1px solid #eef2f7;pointer-events:none}.grid-line.weekend{background:#f6f8fa}.task{position:absolute;height:24px;top:14px;border:1px solid #8295a5;border-radius:5px;box-shadow:0 1px 2px #102b421f;cursor:pointer;color:#1e3648;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:4px 5px;text-align:left;font-weight:650;z-index:3}.task:focus-visible,.event:focus-visible{outline:3px solid #2e7dcd;outline-offset:2px}.task.done{opacity:.6;text-decoration:line-through}.event{position:absolute;top:13px;transform:translateX(-50%);font-size:25px;line-height:1;border:0;background:transparent;color:#df6e3d;cursor:pointer;z-index:4;padding:0}.today{position:absolute;top:0;bottom:0;width:2px;background:#e74e4e;pointer-events:none;z-index:2}.connectors{position:absolute;left:var(--left);top:70px;z-index:2;pointer-events:none;overflow:visible}.empty{padding:32px;text-align:center;color:var(--muted)}.note{padding:13px 15px;color:var(--muted);font-size:12px;line-height:1.6}.alert{background:#fff2e8;color:#813f16;border:1px solid #f4c7a8;padding:16px;border-radius:10px;line-height:1.7;white-space:pre-wrap}dialog{border:0;border-radius:16px;padding:0;box-shadow:0 20px 60px #102b4266;width:min(430px,calc(100vw - 28px));max-height:80vh;overflow:auto}dialog::backdrop{background:#0618278c}.dialog-head{background:#f1f6fa;padding:20px 20px 14px;display:flex;justify-content:space-between;gap:10px;align-items:center}.dialog-head h2{margin:0;font-size:17px}.close{background:white;border:1px solid #cbd8e4;border-radius:7px;padding:4px 10px;font-size:22px;cursor:pointer}.dialog-body{padding:16px 20px 22px}.info{padding:9px 0;border-bottom:1px solid #ecf0f4;display:grid;grid-template-columns:95px 1fr;font-size:13px;gap:8px}.info:last-child{border:0}.info b{color:#667889;font-weight:600}.info div{overflow-wrap:anywhere;white-space:pre-wrap}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
@media(max-width:600px){:root{--left:136px}header{padding:13px 15px}main{padding:13px 8px}.project{font-size:15px}.bar{gap:8px}.row-left,.head-left{padding:0 8px;font-size:11px}.seg button{padding:8px 10px}.chart-scroll{max-height:68vh}.task{font-size:10px}}
</style>
</head>
<body>
<header><div><h1>工程表</h1><small>共有・閲覧用スケジュール</small></div><div class="readonly">👁 閲覧専用</div></header>
<main><div class="bar"><div class="project" id="projectTitle">読み込み中…</div><div class="tools"><label class="sr" for="projectSelect">プロジェクト</label><select id="projectSelect" hidden></select><div class="seg" aria-label="表示単位"><button data-zoom="day">日</button><button data-zoom="week" class="active">週</button><button data-zoom="month">月</button></div><button class="btn" id="todayBtn">今日</button><button class="btn" id="reloadBtn">更新</button></div></div>
<p id="meta" class="meta">データを取得しています</p><div id="legend" class="legend"></div><div class="chart"><div id="scroll" class="chart-scroll"><div id="chartInner" class="chart-inner"><div id="head" class="head-row"></div><div id="rows"></div></div></div><div class="note">横にスクロールして日程を確認できます。工程バーや◆をタップすると詳細を表示します。編集はできません。</div></div><p id="status" role="status"></p></main>
<dialog id="detail"><div class="dialog-head"><h2 id="detailTitle"></h2><button class="close" id="closeDetail" aria-label="閉じる">×</button></div><div id="detailBody" class="dialog-body"></div></dialog>
<script>
(()=>{'use strict';
const FILE='gantt-public.json';
const el=id=>document.getElementById(id);
const DAY=86400000;
const parse=s=>{if(typeof s!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(s))return null;const d=new Date(s+'T00:00:00Z');return Number.isNaN(d.getTime())?null:d};
const stamp=d=>d?d.toISOString().slice(0,10):'';
const dateLabel=s=>{const d=parse(s);return d?`${d.getUTCFullYear()}/${d.getUTCMonth()+1}/${d.getUTCDate()}`:'―'};
const add=(d,n)=>new Date(d.getTime()+n*DAY),diff=(a,b)=>Math.round((a-b)/DAY);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let payload=null,zoom='week',idx=0,range=null,positions={};
const colorFor=(task)=>payload.tags.find(t=>t.id===task.tagId)?.color||'#b5d0e6';
function infoRow(label,value){return `<div class="info"><b>${esc(label)}</b><div>${esc(value)}</div></div>`}
function detail(t){let name=t.name||'無題の工程', tag=payload.tags.find(x=>x.id===t.tagId);el('detailTitle').textContent=name;const parts=[infoRow('種類',t.kind==='event'?'イベント':'工程'),infoRow('開始日',dateLabel(t.start)),infoRow('終了日',dateLabel(t.end)),infoRow('状態',t.done?'完了':'未完了')];if(tag)parts.push(infoRow('分類',tag.name));if(t.deadline)parts.push(infoRow('締切',dateLabel(t.deadline)));if(t.memo)parts.push(infoRow('メモ',t.memo));el('detailBody').innerHTML=parts.join('');el('detail').showModal()}
function getWidth(){return zoom==='day'?38:zoom==='week'?15:5.5}
function draw(){if(!payload)return;const projects=payload.projects||[],p=projects[idx];if(!p)return;el('projectTitle').textContent=p.name||'工程表';const tasks=(p.tasks||[]).filter(t=>parse(t.start)&&parse(t.end));const dates=tasks.flatMap(t=>[parse(t.start),parse(t.end)]);const now=parse(stamp(new Date()));dates.push(now);let min=new Date(Math.min(...dates.map(d=>d.getTime()))),max=new Date(Math.max(...dates.map(d=>d.getTime())));min=add(min,-12);max=add(max,20);const dayW=getWidth(),days=diff(max,min)+1,width=days*dayW;range={min,max,width,dayW,days};el('chartInner').style.width=`${width+parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--left'))}px`;
const head=el('head');head.replaceChildren();const left=document.createElement('div');left.className='head-left';left.textContent='工程名';head.append(left);const ht=document.createElement('div');ht.className='timeline-header';ht.style.width=width+'px';ht.style.minWidth=width+'px';head.append(ht);
const xOf=s=>diff(parse(s),min)*dayW;
for(let d=new Date(min),i=0;i<days;i++,d=add(d,1)){
const day=d.getUTCDate(),month=d.getUTCMonth()+1,weekday=d.getUTCDay();if(day===1||i===0){const next=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+1,1)),remaining=Math.min(days-i,diff(next,d));const m=document.createElement('div');m.className='month-band';m.style.cssText=`left:${i*dayW}px;width:${remaining*dayW}px`;m.textContent=`${d.getUTCFullYear()}年${month}月`;ht.append(m)}
let label='';if(zoom==='day')label=`${day}${'日月火水木金土'[weekday]}`;if(zoom==='week'&&(weekday===1||i===0))label=`${month}/${day}`;if(zoom==='month'&&(day===1||i===0))label=`${month}月`;
if(label){const tick=document.createElement('div');tick.className='tick'+([0,6].includes(weekday)?' weekend':'');tick.style.cssText=`left:${i*dayW}px;width:${zoom==='day'?dayW:zoom==='week'?Math.min(7*dayW,width-i*dayW):Math.min(31*dayW,width-i*dayW)}px`;tick.textContent=label;ht.append(tick)} }
const rows=el('rows');rows.replaceChildren();positions={};tasks.forEach((t,rowIndex)=>{const row=document.createElement('div');row.className='gantt-row';const label=document.createElement('div');label.className='row-left';const mark=t.done?'<span class="check">✓</span>':'';label.innerHTML=`<span class="name">${mark}${esc(t.name||'無題の工程')}</span>`;row.append(label);const track=document.createElement('div');track.className='timeline-row';track.style.cssText=`width:${width}px;min-width:${width}px`;row.append(track);
for(let i=0;i<days;i++){const d=add(min,i),weekend=[0,6].includes(d.getUTCDay());const showGrid=zoom==='day'||(zoom==='week'&&d.getUTCDay()===1)||(zoom==='month'&&d.getUTCDate()===1);if(showGrid||(zoom==='day'&&weekend)){const g=document.createElement('div');g.className='grid-line'+(weekend&&zoom==='day'?' weekend':'');g.style.cssText=`left:${i*dayW}px;width:${zoom==='day'?dayW:1}px`;track.append(g)}}
const x=xOf(t.start),x2=xOf(t.end)+dayW;let btn=document.createElement('button');btn.type='button';btn.title=`${t.name}: ${dateLabel(t.start)}〜${dateLabel(t.end)}`;btn.setAttribute('aria-label',btn.title);if(t.kind==='event'){btn.className='event';btn.textContent='◆';btn.style.left=`${x+dayW/2}px`}else{btn.className='task'+(t.done?' done':'');btn.style.left=x+'px';btn.style.width=Math.max(dayW,x2-x)+'px';btn.style.background=colorFor(t);btn.textContent=(x2-x>70)?t.name:''}btn.addEventListener('click',()=>detail(t));track.append(btn);
positions[t.id]={start:x,end:x2,y:rowIndex*53+26.5};rows.append(row)});
// Connections are lines above bars. They never intercept pointer interaction.
const old=el('connections');if(old)old.remove();let svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('id','connections');svg.setAttribute('class','connectors');svg.setAttribute('width',width);svg.setAttribute('height',tasks.length*53);svg.setAttribute('viewBox',`0 0 ${width} ${tasks.length*53}`);const types={FS:['end','start'],SS:['start','start'],FF:['end','end'],SF:['start','end']};for(const l of payload.links||[]){const from=positions[l.from],to=positions[l.to];if(!from||!to)continue;const pair=types[l.type]||types.FS;let x1=from[pair[0]],x2=to[pair[1]],y1=from.y,y2=to.y;const gap=10;let path=`M ${x1} ${y1} L ${x1+gap} ${y1} L ${x1+gap} ${y2} L ${x2-5} ${y2}`;if(x2<x1+20){const mid=y1+(y2>y1?13:-13);path=`M ${x1} ${y1} L ${x1+8} ${y1} L ${x1+8} ${mid} L ${x2-10} ${mid} L ${x2-10} ${y2} L ${x2-5} ${y2}`}let pth=document.createElementNS('http://www.w3.org/2000/svg','path');pth.setAttribute('d',path);pth.setAttribute('fill','none');pth.setAttribute('stroke','#8493a4');pth.setAttribute('stroke-width','1.5');svg.append(pth);let arrow=document.createElementNS('http://www.w3.org/2000/svg','path');arrow.setAttribute('d',`M ${x2-10} ${y2-4} L ${x2-5} ${y2} L ${x2-10} ${y2+4}`);arrow.setAttribute('stroke','#8493a4');arrow.setAttribute('fill','none');arrow.setAttribute('stroke-width','1.5');svg.append(arrow)}rows.append(svg);
const todayX=diff(now,min)*dayW+dayW/2;if(todayX>=0&&todayX<=width){const ln=document.createElement('div');ln.className='today';ln.style.left=`calc(var(--left) + ${todayX}px)`;ln.style.top='70px';ln.style.height=(tasks.length*53)+'px';ln.style.position='absolute';ln.style.zIndex='2';el('chartInner').append(ln);document.querySelectorAll('#chartInner > .today').forEach((e,i)=>{if(i>0)e.remove()})}
el('legend').innerHTML=(payload.tags||[]).map(t=>`<span><i class="swatch" style="background:${/^#[0-9a-fA-F]{3,8}$/.test(t.color)?t.color:'#b5d0e6'}"></i>${esc(t.name)}</span>`).join('')+'<span>◆ イベント</span><span>赤線：今日</span>';el('meta').textContent=`${tasks.length}件の工程・イベント　｜　${(payload.links||[]).length}件の関連線　｜　確認時刻：${new Date().toLocaleString('ja-JP')}`;
const first=tasks.length?Math.min(...tasks.map(t=>xOf(t.start))):0;el('scroll').scrollLeft=Math.max(0,first-120);
}
function jumpToday(){if(!range)return;const x=diff(parse(stamp(new Date())),range.min)*range.dayW;el('scroll').scrollLeft=Math.max(0,x-el('scroll').clientWidth/2)}
async function load(){el('status').textContent='';try{const url=`${FILE}?v=${Date.now()}`;let res=await fetch(url,{cache:'no-store'});if(!res.ok)throw new Error(`HTTP ${res.status}`);const data=await res.json();if(!data||!Array.isArray(data.projects)||!Array.isArray(data.links)||!Array.isArray(data.tags))throw new Error('対応していないJSON形式です');payload=data;const select=el('projectSelect');select.replaceChildren();payload.projects.forEach((p,i)=>{const option=document.createElement('option');option.value=i;option.textContent=p.name;select.append(option)});idx=Math.min(idx,payload.projects.length-1);select.value=String(idx);select.hidden=payload.projects.length<2;if(!payload.projects.length){el('projectTitle').textContent='公開工程表がありません';el('rows').innerHTML='<div class="empty">公開されたプロジェクトがありません</div>';return}draw()}catch(e){el('projectTitle').textContent='データを読み込めませんでした';el('meta').textContent='';el('status').innerHTML=`<div class="alert">gantt-public.json が見つからないか、形式が異なります。\nindex.html と gantt-public.json を同じフォルダに配置してください。\n詳細: ${esc(e.message)}</div>`}}
document.querySelectorAll('[data-zoom]').forEach(b=>b.addEventListener('click',()=>{zoom=b.dataset.zoom;document.querySelectorAll('[data-zoom]').forEach(c=>c.classList.toggle('active',c===b));draw()}));el('todayBtn').addEventListener('click',jumpToday);el('reloadBtn').addEventListener('click',load);el('projectSelect').addEventListener('change',e=>{idx=Number(e.target.value);draw();el('scroll').scrollLeft=0});el('closeDetail').addEventListener('click',()=>el('detail').close());el('detail').addEventListener('click',e=>{if(e.target===el('detail'))el('detail').close()});load();
})();
</script>
</body></html>
